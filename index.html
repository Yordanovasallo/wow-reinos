<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reinos de Azeroth</title>
<style>
:root{
  --bg:#0f0b07; --panel:#1a130c; --panel2:#241a10; --line:#4a3620;
  --gold:#f0c060; --gold2:#d4a017; --txt:#e8dcc8; --dim:#a89878;
  --green:#4ade80; --bad:#f87171;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #2a1d0f 0%, transparent 60%),
    linear-gradient(#0f0b07, #0a0705 60%, #0d0906);
  color:var(--txt); min-height:100vh;
  font-family:Georgia,"Times New Roman",serif;
}
.hidden{display:none!important}
button{font-family:inherit}
input{font-family:inherit}

/* ---------- portal ---------- */
.screen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px}
.portalBox{
  width:100%; max-width:430px; background:linear-gradient(#211709,#170f08);
  border:2px solid var(--gold2); border-radius:14px; padding:26px 22px 24px;
  box-shadow:0 0 40px rgba(212,160,23,.15), inset 0 0 22px rgba(0,0,0,.5);
}
.logo{font-size:30px; text-align:center; color:var(--gold); letter-spacing:2px; text-shadow:0 2px 0 #000, 0 0 18px rgba(240,192,96,.45); margin:2px 0 6px}
.logoSub{text-align:center; color:var(--dim); font-size:13px; margin:0 0 18px; font-style:italic}
.ptabs{display:flex; gap:8px; margin-bottom:16px}
.ptabs button{flex:1; padding:9px; background:#0f0a06; border:1px solid var(--line); color:var(--dim); border-radius:8px; cursor:pointer; font-size:14px}
.ptabs button.on{background:var(--gold2); color:#1a1206; border-color:var(--gold); font-weight:bold}
form{display:flex; flex-direction:column; gap:10px}
input{padding:11px 12px; background:#0c0805; border:1px solid var(--line); border-radius:7px; color:var(--txt); font-size:14px}
input:focus{outline:none; border-color:var(--gold2)}
.btn{padding:11px; background:linear-gradient(#f0c060,#d4a017); color:#1a1206; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:14px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45; cursor:not-allowed; filter:none}
.btn.sm{padding:8px 12px; font-size:13px; background:#2a1e12; color:var(--txt); border:1px solid var(--line)}
.btn.sm:hover{border-color:var(--gold2)}
.notice{font-size:13px; min-height:16px; color:var(--dim); text-align:center}
.notice.danger{color:var(--bad)}
.notice.ok{color:var(--green)}

/* ---------- juego: barra superior ---------- */
#screenGame{min-height:100vh; display:flex; flex-direction:column}
.topbar{display:flex; align-items:center; gap:12px; padding:10px 14px; background:#160f08; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5}
.menuBtn{display:flex; flex-direction:column; justify-content:center; gap:4px; width:44px; height:38px; background:#241a10; border:1px solid var(--gold2); border-radius:8px; cursor:pointer; padding:0 10px}
.menuBtn span{display:block; height:2px; background:var(--gold); border-radius:2px}
.menuBtn:hover{background:#2e2113}
.topInfo{margin-left:auto; text-align:right; line-height:1.25}
.topRealm{display:block; color:var(--gold); font-size:15px}
.topKing{display:block; color:var(--dim); font-size:12px}

/* ---------- menú plegable ---------- */
#menuOver{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:20}
#menu{position:fixed; top:0; left:0; height:100%; width:250px; max-width:82vw; background:linear-gradient(#211709,#140d07);
  border-right:2px solid var(--gold2); z-index:21; transform:translateX(-105%); transition:transform .25s ease; display:flex; flex-direction:column; padding:14px 12px}
#menu.open{transform:translateX(0)}
.menuTitle{color:var(--gold); font-size:17px; padding:6px 8px 14px; border-bottom:1px solid var(--line); margin-bottom:10px}
.menuItem{display:block; width:100%; text-align:left; padding:12px 12px; margin-bottom:6px; background:#150f09; border:1px solid var(--line); border-radius:8px; color:var(--txt); font-size:15px; cursor:pointer}
.menuItem:hover{border-color:var(--gold2)}
.menuItem.on{background:var(--gold2); color:#1a1206; border-color:var(--gold); font-weight:bold}
.menuItem.danger{margin-top:auto; color:var(--bad); border-color:#5a2a2a}

/* ---------- contenido ---------- */
.page{flex:1; padding:18px 14px 40px; max-width:900px; width:100%; margin:0 auto}
.pageTitle{color:var(--gold); font-size:22px; margin:0 0 4px}
.pageSub{color:var(--dim); font-size:13px; margin:0 0 16px}
.cardHome{background:linear-gradient(#211709,#170f08); border:2px solid var(--gold2); border-radius:14px; padding:24px 20px; max-width:460px}
.realmTitle{font-size:24px; color:var(--gold); text-shadow:0 1px 0 #000; margin:0 0 4px}
.kingLine{color:var(--dim); font-size:14px; margin:0 0 16px}
.kingLine b{color:var(--txt)}
.hint{color:var(--dim); font-size:14px; line-height:1.5}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px}
.bcard{background:linear-gradient(#211709,#170f08); border:1px solid var(--line); border-radius:10px; padding:13px; display:flex; flex-direction:column; gap:12px}
.bcard.done{border-color:#3f5a2f}
.bcardTop{display:flex; gap:11px; align-items:flex-start}
.emoji{font-size:27px; line-height:1}
.bName{font-size:15px; font-weight:bold}
.bDesc{font-size:12px; color:var(--dim); margin-top:3px}
.bcard .btn{margin-top:auto}
.built{display:flex; align-items:center; gap:7px; color:var(--green); font-size:14px; padding:9px 0}
.built .lvl{margin-left:auto; color:var(--gold); font-size:12px}
.rowBtns{display:flex; gap:8px; margin-top:16px}
.rowBtns .btn{flex:1}
</style>
</head>
<body>

<!-- ============ PORTAL ============ -->
<div id="screenPortal" class="screen hidden">
  <div class="portalBox">
    <div class="logo">⚔️ REINOS DE AZEROTH</div>
    <p class="logoSub">Crea tu reino y entra a jugar.</p>
    <div class="ptabs">
      <button id="tabLogin" class="on">Entrar</button>
      <button id="tabReg">Crear cuenta</button>
    </div>

    <form id="formLogin">
      <input id="liName" placeholder="Nombre del rey" autocomplete="username">
      <input id="liPass" type="password" placeholder="Contraseña" autocomplete="current-password">
      <button class="btn">Entrar</button>
      <div id="liMsg" class="notice"></div>
    </form>

    <form id="formReg" class="hidden">
      <input id="rgName" placeholder="Nombre del rey" autocomplete="username">
      <input id="rgRealm" placeholder="Nombre del reino" autocomplete="off">
      <input id="rgPass" type="password" placeholder="Contraseña" autocomplete="new-password">
      <button class="btn">Crear cuenta</button>
      <div id="rgMsg" class="notice"></div>
    </form>
  </div>
</div>

<!-- ============ JUEGO ============ -->
<div id="screenGame" class="hidden">
  <header class="topbar">
    <button id="menuBtn" class="menuBtn" aria-label="Menú"><span></span><span></span><span></span></button>
    <div class="topInfo">
      <span class="topRealm" id="topRealm"></span>
      <span class="topKing" id="topKing"></span>
    </div>
  </header>

  <div id="menuOver" class="hidden"></div>
  <nav id="menu" class="hidden">
    <div class="menuTitle">⚔️ <span id="menuRealm"></span></div>
    <button class="menuItem" data-page="home">🏠 Inicio</button>
    <button class="menuItem" data-page="buildings">🏰 Edificios</button>
    <button class="menuItem" data-page="account">👤 Mi cuenta</button>
    <button class="menuItem danger" id="mLogout">🚪 Salir</button>
  </nav>

  <main id="page" class="page"></main>
</div>

<script src="wow-app.js"></script>
</body>
</html>
